# nginx: keep serving the site, hand /api/ to the collector.
#
# Add this to the existing server{} for fabric.nfh.global. Nothing else
# changes — the onboarding form is part of index.html and is already served.
#
#   sudo nginx -t && sudo systemctl reload nginx

    # The collector. Listens on loopback only; nginx is its front door.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Submissions are small and quick; don't hold sockets open.
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # The local cache of the domains list is data, not a public asset. The
    # collector already refuses to serve it; this makes sure nginx doesn't.
    location = /fabric.domains.txt {
        deny all;
    }

# Optional second line of defence in front of the collector's own limiter.
# In the http{} block:
#     limit_req_zone $binary_remote_addr zone=onboarding:10m rate=10r/m;
# then inside location /api/ above:
#     limit_req zone=onboarding burst=5 nodelay;
