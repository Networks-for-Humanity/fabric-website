# nginx: serve the static site, hand /api/ to the collector.
#
# Add the two blocks below to the existing server{} for fabric.nfh.global.
# Everything else in that server block stays as it is.
#
#   sudo nginx -t && sudo systemctl reload nginx

    # /onboarding → onboarding/index.html, without the trailing slash.
    # The site is plain files, so this is what makes the clean URL work.
    location = /onboarding {
        try_files /onboarding/index.html =404;
    }

    # The collector. Listens on loopback only; nginx is its front door.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Submissions are small and quick; don't hold sockets open.
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;

        # A second line of defence in front of the app's own limiter.
        # Requires, in the http{} block:
        #   limit_req_zone $binary_remote_addr zone=onboarding:10m rate=10r/m;
        # limit_req zone=onboarding burst=5 nodelay;
    }

    # The domains cache is data, not a public asset. The collector already
    # refuses to serve it; this makes sure nginx doesn't either.
    location = /fabric.domains.txt {
        deny all;
    }
