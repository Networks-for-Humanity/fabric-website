# Optional. Only needed if you want /onboarding to work without a trailing
# slash — most setups already serve /onboarding/ via the index directive.
#
# Add inside the existing server{} for fabric.nfh.global, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nothing else changes: the page is a static file deployed with the rest of
# the site, and the form talks to the Vercel function directly, so there is
# no proxying to configure.

    location = /onboarding {
        try_files /onboarding/index.html =404;
    }
